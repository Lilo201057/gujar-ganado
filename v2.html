<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#245b3b"><title>GUJAR Ganado V2</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f6f3;color:#17251d;padding-bottom:76px}header{background:#245b3b;color:white;padding:15px;position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center}header b{font-size:20px}.pill{background:#ffffff22;padding:8px 10px;border-radius:10px}main{max-width:760px;margin:auto;padding:15px}.view{display:none}.view.active{display:block}h1{font-size:24px;margin:8px 0}h2{margin:8px 0}.muted{color:#65736a}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:#fff;border:1px solid #dbe3dd;border-radius:14px;padding:15px;margin:10px 0}.metric b{display:block;font-size:26px}.metric span{font-size:12px;color:#65736a}button{border:0;border-radius:11px;background:#2f6f49;color:white;padding:13px 15px;font-weight:700;font-size:16px}button.secondary{background:#e5ebe7;color:#244331}.wide{width:100%}input,select,textarea{width:100%;padding:12px;margin:5px 0 10px;border:1px solid #c9d3cc;border-radius:9px;font-size:16px;background:white}label{font-weight:650}.animal{width:100%;text-align:left;background:#fff;color:#17251d;border:1px solid #dbe3dd;margin:6px 0}.animal small{display:block;color:#65736a;margin-top:4px}.good{color:#176b38}.warn{color:#a06400}.bad{color:#a22}.big{font-size:24px;font-weight:800}.forecast{border-left:5px solid #2f6f49}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #dbe3dd;display:flex;justify-content:center;gap:7px;padding:9px;z-index:3}nav button{font-size:13px;padding:10px;min-width:75px}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:500px}th,td{padding:9px;border-bottom:1px solid #e5ebe7;text-align:right}th:first-child,td:first-child{text-align:left}@media(max-width:520px){.grid{grid-template-columns:1fr 1fr}main{padding:12px}}
</style></head><body><header><b>GUJAR Ganado <small>V2</small></b><div class="pill" id="farmTop">Escoger finca</div></header><main>
<section id="farms" class="view active"><h1>¿En qué finca va a trabajar?</h1><div class="grid"><button onclick="chooseFarm('La Insula')">La Insula</button><button onclick="chooseFarm('Montecristo')">Montecristo</button></div></section>
<section id="home" class="view"><h1>Control de ceba</h1><div class="grid"><div class="card metric"><b id="mAct">0</b><span>Animales activos</span></div><div class="card metric"><b id="mKg">0</b><span>Kg vivos actuales</span></div><div class="card metric"><b id="mGmd">—</b><span>GMD promedio</span></div><div class="card metric"><b id="m90">0</b><span>Ventas proyectadas 90 días</span></div></div><button class="wide" onclick="go('weigh')">⚖️ Registrar pesaje</button><button class="wide secondary" style="margin-top:9px" onclick="go('forecast')">📅 Proyección de ventas</button></section>
<section id="weigh" class="view"><h1>Nuevo pesaje</h1><label>Animal (visual o RFID)<input id="searchAnimal" placeholder="Ej. 201 o RFID" oninput="findAnimal()"></label><div id="found"></div><div id="weighForm" style="display:none"><div class="card" id="prevInfo"></div><label>Fecha<input type="date" id="wDate"></label><label>Nuevo peso (kg)<input type="number" step=".1" id="wKg"></label><button class="wide" onclick="saveWeight()">Guardar pesaje</button></div></section>
<section id="animals" class="view"><h1>Animales</h1><div id="animalList"></div></section>
<section id="detail" class="view"><div id="detailBody"></div></section>
<section id="forecast" class="view"><h1>Proyección de ventas</h1><p class="muted">Hembras 430 kg · Machos 500 kg. Pronóstico basado en la GMD real disponible.</p><div id="forecastSummary"></div><div id="forecastList"></div></section>
</main><nav><button onclick="go('home')">Inicio</button><button onclick="go('weigh')">Pesaje</button><button onclick="go('animals')">Animales</button><button onclick="go('forecast')">Ventas</button></nav>
<script>
const KA='gujar_animales_v1',KS='gujar_finca_activa';let animals=[],farm='',selected=null;try{animals=JSON.parse(localStorage.getItem(KA)||'[]');farm=localStorage.getItem(KS)||''}catch(e){}if(farm==='La Indiana')farm='Montecristo';const $=x=>document.getElementById(x);const day=86400000;function go(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));$(id).classList.add('active');if(id==='home')dashboard();if(id==='animals')renderAnimals();if(id==='forecast')renderForecast()}function chooseFarm(f){farm=f;localStorage.setItem(KS,f);$('farmTop').textContent=f;go('home')}function today(){return new Date().toISOString().slice(0,10)}$('wDate').value=today();$('farmTop').onclick=()=>go('farms');
function active(){return animals.filter(a=>a.estado==='Activo'&&a.finca===farm)}function ps(a){return (a.pesajes&&a.pesajes.length?a.pesajes:[{fecha:a.fecha||today(),peso:a.pesoEntrada||0}]).slice().sort((x,y)=>x.fecha.localeCompare(y.fecha))}function last(a){let p=ps(a);return Number(p[p.length-1]?.peso||0)}function stats(a){let p=ps(a);if(p.length<2)return{gmd:null,days:0};let first=p[0],lastp=p[p.length-1],d=Math.max(1,Math.round((new Date(lastp.fecha)-new Date(first.fecha))/day));return{gmd:(Number(lastp.peso)-Number(first.peso))/d,days:d}}function target(a){return a.sexo==='Hembra'?430:500}function prediction(a){let s=stats(a),w=last(a),t=target(a);if(w>=t)return{days:0,date:today(),gmd:s.gmd,status:'meta'};if(s.gmd==null)return{date:null,gmd:null,status:'datos'};if(s.gmd<=0)return{date:null,gmd:s.gmd,status:'sin'};let d=Math.ceil((t-w)/s.gmd),dt=new Date();dt.setDate(dt.getDate()+d);return{days:d,date:dt.toISOString().slice(0,10),gmd:s.gmd,status:s.gmd<.15?'baja':'ok'}}function dashboard(){let aa=active(),kg=aa.reduce((s,a)=>s+last(a),0),gs=aa.map(a=>stats(a).gmd).filter(x=>x!=null);$('mAct').textContent=aa.length;$('mKg').textContent=Math.round(kg).toLocaleString('es-CO');$('mGmd').textContent=gs.length?Math.round(gs.reduce((a,b)=>a+b,0)/gs.length*1000)+' g/d':'—';$('m90').textContent=aa.filter(a=>{let p=prediction(a);return p.days!=null&&p.days<=90}).length}
function findAnimal(){let q=$('searchAnimal').value.trim().toLowerCase();selected=null;$('weighForm').style.display='none';if(!q){$('found').innerHTML='';return}let a=active().find(x=>String(x.visual||'').toLowerCase().includes(q)||String(x.rfid||'').includes(q));if(!a){$('found').innerHTML='<div class="card">No encontrado en '+farm+'</div>';return}selected=a;$('found').innerHTML='<div class="card"><b>'+a.visual+'</b> · '+a.sexo+' · '+last(a)+' kg</div>';$('prevInfo').innerHTML='Peso anterior: <b>'+last(a)+' kg</b><br>Último registro: '+ps(a).slice(-1)[0].fecha;$('weighForm').style.display='block';$('wKg').focus()}
function saveWeight(){if(!selected)return;let kg=Number($('wKg').value),date=$('wDate').value;if(!kg||!date)return alert('Ingrese fecha y peso.');selected.pesajes=selected.pesajes||[];selected.pesajes.push({fecha:date,peso:kg,origen:'Manual'});selected.pesajes.sort((a,b)=>a.fecha.localeCompare(b.fecha));localStorage.setItem(KA,JSON.stringify(animals));let pr=prediction(selected);alert('Pesaje guardado. GMD: '+(pr.gmd==null?'sin datos':Math.round(pr.gmd*1000)+' g/d')+(pr.date?' · Venta estimada: '+pr.date:''));$('searchAnimal').value='';$('wKg').value='';$('found').innerHTML='';$('weighForm').style.display='none';dashboard()}
function renderAnimals(){let aa=active();$('animalList').innerHTML=aa.length?aa.map(a=>{let pr=prediction(a);return '<button class="animal" onclick="showAnimal(\''+a.id+'\')"><b>'+a.visual+' · '+last(a)+' kg</b><small>'+a.sexo+' · RFID '+(a.rfid||'—')+' · '+(pr.date?'Venta '+pr.date:'Sin fecha proyectada')+'</small></button>'}).join(''):'<div class="card">No hay animales activos en esta finca.</div>'}
function showAnimal(id){let a=animals.find(x=>x.id===id);if(!a)return;let s=stats(a),pr=prediction(a),p=ps(a),rows=p.map((x,i)=>{let ant=i?p[i-1]:null,d=ant?Math.max(1,Math.round((new Date(x.fecha)-new Date(ant.fecha))/day)):0,g=ant?(Number(x.peso)-Number(ant.peso))/d:null;return '<tr><td>'+x.fecha+'</td><td>'+x.peso+'</td><td>'+(g==null?'—':Math.round(g*1000))+'</td></tr>'}).join('');$('detailBody').innerHTML='<h1>HV '+a.visual+'</h1><div class="grid"><div class="card metric"><b>'+last(a)+'</b><span>kg actuales</span></div><div class="card metric"><b>'+(s.gmd==null?'—':Math.round(s.gmd*1000))+'</b><span>GMD g/día</span></div><div class="card metric"><b>'+target(a)+'</b><span>meta kg</span></div><div class="card metric"><b>'+(pr.date||'—')+'</b><span>venta estimada</span></div></div><div class="card forecast"><b>Pronóstico</b><p>'+(pr.date?'Fecha estimada de venta: <b>'+pr.date+'</b> · faltan '+pr.days+' días.':pr.status==='sin'?'Sin fecha: no hay ganancia positiva.':'Se requieren al menos dos pesajes para proyectar.')+'</p></div><h2>Historial de pesajes</h2><div class="table"><table><tr><th>Fecha</th><th>Kg</th><th>GMD g/d</th></tr>'+rows+'</table></div>';go('detail')}
function renderForecast(){let aa=active(),items=aa.map(a=>({a,p:prediction(a)})).sort((x,y)=>(x.p.date||'9999').localeCompare(y.p.date||'9999')),m={};items.forEach(x=>{if(x.p.date){let k=x.p.date.slice(0,7);m[k]=(m[k]||0)+1}});$('forecastSummary').innerHTML=Object.keys(m).length?'<div class="grid">'+Object.entries(m).map(([k,n])=>'<div class="card metric"><b>'+n+'</b><span>'+k+'</span></div>').join('')+'</div>':'<div class="card">Aún no hay suficientes pesajes para proyectar ventas.</div>';$('forecastList').innerHTML=items.map(x=>'<div class="card"><b>'+x.a.visual+' · '+last(x.a)+' kg</b><br><span class="'+(x.p.status==='baja'?'warn':x.p.status==='sin'?'bad':'good')+'">'+(x.p.date?'Venta estimada '+x.p.date+' · GMD '+Math.round(x.p.gmd*1000)+' g/d':'Sin fecha proyectada')+'</span></div>').join('')}
if(farm){$('farmTop').textContent=farm;go('home')}
</script></body></html>
