<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GUJAR Ganado V2.3</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f3f6f3;color:#17251d;padding-bottom:72px}header{background:#245b3b;color:#fff;padding:15px;display:flex;justify-content:space-between}main{max-width:780px;margin:auto;padding:15px}.view{display:none}.active{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:#fff;border:1px solid #dbe3dd;border-radius:13px;padding:14px;margin:9px 0}.metric b{font-size:25px;display:block}.metric span,.muted{color:#65736a;font-size:13px}button{border:0;border-radius:10px;background:#2f6f49;color:#fff;padding:12px 14px;font-weight:700}.wide{width:100%;margin:5px 0}.animal{width:100%;text-align:left;background:#fff;color:#17251d;border:1px solid #dbe3dd;margin:5px 0}.animal small{display:block;color:#65736a;margin-top:4px}.status{background:#eaf5ed;padding:9px;border-radius:9px}.warn{color:#996000}.good{color:#176b38}input,select{width:100%;padding:11px;margin:5px 0 10px;border:1px solid #c9d3cc;border-radius:9px;font-size:16px}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:right}td:first-child,th:first-child{text-align:left}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;padding:8px;display:flex;justify-content:center;gap:7px}</style></head><body><header><b>GUJAR Ganado V2.3</b><span>Pesajes</span></header><main><div id="cloud" class="status">Consultando Supabase...</div>
<section id="home" class="view active"><h2>Control de ceba</h2><div class="grid"><div class="card metric"><b id="n">0</b><span>Animales de prueba</span></div><div class="card metric"><b id="kg">0</b><span>Kg actuales</span></div><div class="card metric"><b id="gmd">—</b><span>GMD promedio</span></div><div class="card metric"><b id="p90">0</b><span>Llegan a meta ≤90 días</span></div></div><button class="wide" onclick="go('weigh')">⚖ Registrar pesaje</button></section>
<section id="weigh" class="view"><h2>Registrar pesaje</h2><label>Animal<select id="wa" onchange="weighInfo()"></select></label><div id="wi" class="card"></div><label>Fecha<input id="wd" type="date"></label><label>Nuevo peso (kg)<input id="wk" type="number" step=".1" placeholder="Ej. 335.5"></label><button class="wide" onclick="saveWeight()">Guardar pesaje</button><div id="wm"></div></section>
<section id="animals" class="view"><h2>Animales</h2><div id="list"></div></section><section id="detail" class="view"><div id="detailBody"></div></section>
<section id="forecast" class="view"><h2>Proyección de venta</h2><p class="muted">Macho 500 kg · Hembra 430 kg. GMD calculada con los días reales entre pesajes.</p><div id="forecastList"></div></section></main>
<nav><button onclick="go('home')">Inicio</button><button onclick="go('weigh')">Pesaje</button><button onclick="go('animals')">Animales</button><button onclick="go('forecast')">Ventas</button></nav><script>
const B='https://jkpvlrqtvdehhygyddkx.supabase.co/rest/v1/',K='sb_publishable_3M-XzX4D8AzcivBZ7zIBOw_TpFDTLsf',H={apikey:K,Authorization:'Bearer '+K};let A=[],P=[];const $=x=>document.getElementById(x),DAY=86400000;$('wd').value=new Date().toISOString().slice(0,10);function go(id){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');if(id==='animals')render();if(id==='forecast')forecast();if(id==='weigh')fillSelect()}async function load(){let [ra,rp]=await Promise.all([fetch(B+'gujar_animales?select=*&estado=eq.Activo&order=id',{headers:H}),fetch(B+'gujar_pesajes?select=*&order=fecha.asc',{headers:H})]);A=await ra.json();P=await rp.json();$('cloud').innerHTML='<b>● Base definitiva conectada</b> · '+A.length+' animales · '+P.length+' pesajes';dash();render();fillSelect()}function weights(a){return P.filter(p=>p.animal_id===a.id).sort((x,y)=>x.fecha.localeCompare(y.fecha))}function stat(a){let w=weights(a);if(!w.length)return{peso:+a.peso_entrada,g:null};let l=w.at(-1),peso=+l.peso_kg;if(w.length<2)return{peso,g:null};let f=w[0],days=Math.max(1,Math.round((new Date(l.fecha)-new Date(f.fecha))/DAY));return{peso,g:(peso-(+f.peso_kg))/days,days}}function pred(a){let s=stat(a),meta=a.sexo==='Hembra'?430:500;if(s.peso>=meta)return{...s,meta,dias:0,fecha:'Meta alcanzada'};if(s.g==null||s.g<=0)return{...s,meta,dias:null,fecha:null};let dias=Math.ceil((meta-s.peso)/s.g),d=new Date();d.setDate(d.getDate()+dias);return{...s,meta,dias,fecha:d.toISOString().slice(0,10)}}function dash(){let ss=A.map(stat),gs=ss.filter(x=>x.g!=null).map(x=>x.g);$('n').textContent=A.length;$('kg').textContent=Math.round(ss.reduce((z,x)=>z+x.peso,0)).toLocaleString('es-CO');$('gmd').textContent=gs.length?Math.round(gs.reduce((a,b)=>a+b,0)/gs.length*1000)+' g/d':'—';$('p90').textContent=A.filter(a=>{let p=pred(a);return p.dias!=null&&p.dias<=90}).length}function render(){$('list').innerHTML=A.map(a=>{let p=pred(a);return '<button class="animal" onclick="detail('+a.id+')"><b>'+a.numero_visual+' · '+p.peso+' kg</b><small>'+a.finca+' · '+a.sexo+' · GMD '+(p.g==null?'—':Math.round(p.g*1000)+' g/d')+' · '+(p.fecha||'sin fecha')+'</small></button>'}).join('')}function fillSelect(){let old=$('wa').value;$('wa').innerHTML=A.map(a=>'<option value="'+a.id+'">'+a.numero_visual+' · '+a.finca+'</option>').join('');if(old)$('wa').value=old;weighInfo()}function weighInfo(){let a=A.find(x=>x.id==$('wa').value);if(!a)return;let p=pred(a),w=weights(a);$('wi').innerHTML='<b>'+a.numero_visual+' · '+a.sexo+'</b><br>Peso anterior: <b>'+p.peso+' kg</b> · '+(w.length?w.at(-1).fecha:a.fecha_ingreso)+'<br>GMD actual: '+(p.g==null?'—':Math.round(p.g*1000)+' g/d')+' · Meta '+p.meta+' kg'}async function saveWeight(){let a=A.find(x=>x.id==$('wa').value),fecha=$('wd').value,peso=+$('wk').value;if(!a||!fecha||!peso)return alert('Ingrese animal, fecha y peso.');let w=weights(a);if(w.length&&fecha<=w.at(-1).fecha)return alert('La fecha debe ser posterior al último pesaje: '+w.at(-1).fecha);$('wm').textContent='Guardando...';let r=await fetch(B+'gujar_pesajes',{method:'POST',headers:{...H,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({animal_id:a.id,fecha,peso_kg:peso,origen:'Manual'})});if(!r.ok){$('wm').textContent='Error al guardar: HTTP '+r.status;return}await load();let np=pred(A.find(x=>x.id===a.id));$('wm').innerHTML='<div class="card good"><b>✓ Pesaje guardado</b><br>Nueva GMD: '+Math.round(np.g*1000)+' g/d'+(np.fecha?' · Venta estimada: '+np.fecha:'')+'</div>';$('wk').value='';weighInfo()}function detail(id){let a=A.find(x=>x.id===id),p=pred(a),w=weights(a),rows=w.map((x,i)=>{let g='—';if(i){let d=Math.max(1,Math.round((new Date(x.fecha)-new Date(w[i-1].fecha))/DAY));g=Math.round((+x.peso_kg-(+w[i-1].peso_kg))/d*1000)}return '<tr><td>'+x.fecha+'</td><td>'+x.peso_kg+'</td><td>'+g+'</td></tr>'}).join('');$('detailBody').innerHTML='<h2>HV '+a.numero_visual+'</h2><div class="grid"><div class="card metric"><b>'+p.peso+'</b><span>kg actuales</span></div><div class="card metric"><b>'+(p.g==null?'—':Math.round(p.g*1000))+'</b><span>GMD g/día</span></div><div class="card metric"><b>'+p.meta+'</b><span>meta kg</span></div><div class="card metric"><b>'+(p.fecha||'—')+'</b><span>venta estimada</span></div></div><table><tr><th>Fecha</th><th>Kg</th><th>GMD período g/d</th></tr>'+rows+'</table>';go('detail')}function forecast(){let x=A.map(a=>({a,p:pred(a)})).sort((x,y)=>(x.p.fecha||'9999').localeCompare(y.p.fecha||'9999'));$('forecastList').innerHTML=x.map(x=>'<div class="card"><b>'+x.a.numero_visual+' · '+x.p.peso+' kg → '+x.p.meta+' kg</b><br>GMD '+(x.p.g==null?'—':Math.round(x.p.g*1000)+' g/d')+' · '+(x.p.fecha?'Venta '+x.p.fecha:'Sin fecha todavía')+'</div>').join('')}load();
</script></body></html>
