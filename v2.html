<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GUJAR Ganado V2.2</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f3f6f3;color:#17251d;padding-bottom:72px}header{background:#245b3b;color:#fff;padding:15px;display:flex;justify-content:space-between}main{max-width:780px;margin:auto;padding:15px}.view{display:none}.active{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:#fff;border:1px solid #dbe3dd;border-radius:13px;padding:14px;margin:9px 0}.metric b{font-size:25px;display:block}.metric span,.muted{color:#65736a;font-size:13px}button{border:0;border-radius:10px;background:#2f6f49;color:#fff;padding:12px 14px;font-weight:700}.wide{width:100%;margin:5px 0}.animal{width:100%;text-align:left;background:#fff;color:#17251d;border:1px solid #dbe3dd;margin:5px 0}.animal small{display:block;color:#65736a;margin-top:4px}.status{background:#eaf5ed;padding:9px;border-radius:9px}.warn{color:#996000}.bad{color:#a22}.good{color:#176b38}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:right}td:first-child,th:first-child{text-align:left}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;padding:8px;display:flex;justify-content:center;gap:7px}</style></head><body><header><b>GUJAR Ganado V2.2</b><span>Prueba GMD</span></header><main><div id="cloud" class="status">Consultando Supabase...</div>
<section id="home" class="view active"><h2>Control de ceba</h2><div class="grid"><div class="card metric"><b id="n">0</b><span>Animales de prueba</span></div><div class="card metric"><b id="kg">0</b><span>Kg actuales</span></div><div class="card metric"><b id="gmd">—</b><span>GMD promedio</span></div><div class="card metric"><b id="p90">0</b><span>Llegan a meta ≤90 días</span></div></div></section>
<section id="animals" class="view"><h2>Animales</h2><div id="list"></div></section>
<section id="detail" class="view"><div id="detailBody"></div></section>
<section id="forecast" class="view"><h2>Proyección de venta</h2><p class="muted">Macho 500 kg · Hembra 430 kg. Basado en la ganancia real entre el primer y último pesaje disponible.</p><div id="forecastList"></div></section>
</main><nav><button onclick="go('home')">Inicio</button><button onclick="go('animals')">Animales</button><button onclick="go('forecast')">Ventas</button></nav><script>
const B='https://jkpvlrqtvdehhygyddkx.supabase.co/rest/v1/',K='sb_publishable_3M-XzX4D8AzcivBZ7zIBOw_TpFDTLsf',H={apikey:K,Authorization:'Bearer '+K};let A=[],P=[];const $=x=>document.getElementById(x),DAY=86400000;function go(id){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');if(id==='animals')render();if(id==='forecast')forecast()}async function load(){try{let [ra,rp]=await Promise.all([fetch(B+'gujar_animales?select=*&estado=eq.Activo&order=id',{headers:H}),fetch(B+'gujar_pesajes?select=*&order=fecha.asc',{headers:H})]);if(!ra.ok||!rp.ok)throw Error('HTTP '+ra.status+'/'+rp.status);A=await ra.json();P=await rp.json();$('cloud').innerHTML='<b>● Base definitiva conectada</b> · '+A.length+' animales · '+P.length+' pesajes';dash();render()}catch(e){$('cloud').textContent='⚠ Error de conexión: '+e.message}}function weights(a){return P.filter(p=>p.animal_id===a.id).sort((x,y)=>x.fecha.localeCompare(y.fecha))}function stat(a){let w=weights(a);if(!w.length)return{peso:Number(a.peso_entrada),g:null};let last=w[w.length-1],peso=Number(last.peso_kg);if(w.length<2)return{peso,g:null};let first=w[0],days=Math.max(1,Math.round((new Date(last.fecha)-new Date(first.fecha))/DAY));return{peso,g:(peso-Number(first.peso_kg))/days,days}}function pred(a){let s=stat(a),meta=a.sexo==='Hembra'?430:500;if(s.peso>=meta)return{...s,meta,dias:0,fecha:'Meta alcanzada'};if(s.g==null||s.g<=0)return{...s,meta,dias:null,fecha:null};let dias=Math.ceil((meta-s.peso)/s.g),d=new Date();d.setDate(d.getDate()+dias);return{...s,meta,dias,fecha:d.toISOString().slice(0,10)}}function dash(){let ss=A.map(stat),gs=ss.filter(x=>x.g!=null).map(x=>x.g);$('n').textContent=A.length;$('kg').textContent=Math.round(ss.reduce((z,x)=>z+x.peso,0)).toLocaleString('es-CO');$('gmd').textContent=gs.length?Math.round(gs.reduce((a,b)=>a+b,0)/gs.length*1000)+' g/d':'—';$('p90').textContent=A.filter(a=>{let p=pred(a);return p.dias!=null&&p.dias<=90}).length}function render(){$('list').innerHTML=A.map(a=>{let p=pred(a);return '<button class="animal" onclick="detail('+a.id+')"><b>'+a.numero_visual+' · '+p.peso+' kg</b><small>'+a.finca+' · '+a.sexo+' · GMD '+(p.g==null?'—':Math.round(p.g*1000)+' g/d')+' · '+(p.fecha||'sin fecha')+'</small></button>'}).join('')}function detail(id){let a=A.find(x=>x.id===id),p=pred(a),w=weights(a),rows=w.map((x,i)=>{let g='—';if(i){let d=Math.max(1,Math.round((new Date(x.fecha)-new Date(w[i-1].fecha))/DAY));g=Math.round((Number(x.peso_kg)-Number(w[i-1].peso_kg))/d*1000)}return '<tr><td>'+x.fecha+'</td><td>'+x.peso_kg+'</td><td>'+g+'</td></tr>'}).join('');$('detailBody').innerHTML='<h2>HV '+a.numero_visual+'</h2><div class="grid"><div class="card metric"><b>'+p.peso+'</b><span>kg actuales</span></div><div class="card metric"><b>'+(p.g==null?'—':Math.round(p.g*1000))+'</b><span>GMD g/día</span></div><div class="card metric"><b>'+p.meta+'</b><span>meta kg</span></div><div class="card metric"><b>'+(p.fecha||'—')+'</b><span>venta estimada</span></div></div><div class="card"><b>'+a.sexo+' · '+a.finca+'</b><br>Faltan '+Math.max(0,p.meta-p.peso).toFixed(1)+' kg'+(p.dias!=null?' · '+p.dias+' días estimados':' · faltan pesajes para proyectar')+'</div><table><tr><th>Fecha</th><th>Kg</th><th>GMD período g/d</th></tr>'+rows+'</table>';go('detail')}function forecast(){let x=A.map(a=>({a,p:pred(a)})).sort((x,y)=>(x.p.fecha||'9999').localeCompare(y.p.fecha||'9999'));$('forecastList').innerHTML=x.map(x=>'<div class="card"><b>'+x.a.numero_visual+' · '+x.p.peso+' kg → '+x.p.meta+' kg</b><br><span class="'+(x.p.g!=null&&x.p.g<.15?'warn':'good')+'">GMD '+(x.p.g==null?'—':Math.round(x.p.g*1000)+' g/d')+' · '+(x.p.fecha?'Venta '+x.p.fecha:'Sin fecha todavía')+'</span></div>').join('')}load();
</script></body></html>
