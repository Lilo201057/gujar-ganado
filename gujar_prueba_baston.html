<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GUJAR · Prueba de bastón BLE</title><style>body{font-family:system-ui,Arial;background:#f5f8f7;color:#163b34;margin:0;padding:22px;max-width:640px}h1{font-size:1.5rem}button{border:0;border-radius:12px;padding:15px 18px;background:#237e6d;color:white;font-size:1rem;font-weight:700;margin:6px 6px 6px 0}button:disabled{background:#9da9a5}section{background:white;border:1px solid #dce8e4;border-radius:15px;padding:18px;margin:14px 0}.number{font-size:1.7rem;font-weight:800;overflow-wrap:anywhere}small{color:#536d65}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eaf1ee;padding:12px;border-radius:8px}#status{font-weight:700}</style></head><body><h1>GUJAR · Prueba del bastón</h1><p>Prueba de lectura Bluetooth BLE sin modificar los animales ni los pesajes.</p><section><div id="status" role="status">Sin conectar</div><button id="connect">Conectar bastón</button><button id="disconnect" disabled>Desconectar</button><p><small>Seleccione WS-S02-SPP. Cierre Identigan y nRF Connect antes de conectar.</small></p></section><section><small>Último chip recibido</small><div class="number" id="chip">—</div><p id="count">Lecturas: 0</p></section><section><small>Registro de diagnóstico (local, no se envía)</small><pre id="log">Esperando conexión…</pre></section><script>
'use strict';
const $=id=>document.getElementById(id);let device=null,characteristic=null,buffer='',count=0;
const serviceUUID=0xFFE0,notifyUUID=0xFFE4;
function log(message){$('log').textContent=new Date().toLocaleTimeString('es-CO')+' · '+message+'\n'+$('log').textContent.slice(0,3000)}
function status(s){$('status').textContent=s}
function disconnected(){status('Desconectado');$('connect').disabled=false;$('disconnect').disabled=true;characteristic=null;log('Conexión cerrada')}
function received(event){const bytes=new Uint8Array(event.target.value.buffer,event.target.value.byteOffset,event.target.value.byteLength);const text=new TextDecoder('ascii').decode(bytes);log('Recibido: '+Array.from(bytes).map(v=>v.toString(16).padStart(2,'0')).join(' ').toUpperCase());buffer+=text;let parts=buffer.split(/\r\n|\n|\r/);buffer=parts.pop()||'';for(const part of parts){const chip=part.trim();if(/^\d{10,20}$/.test(chip)){$('chip').textContent=chip;$('count').textContent='Lecturas: '+(++count);log('Chip: '+chip)}else if(chip)log('Dato no reconocido: '+JSON.stringify(chip))}if(buffer.length>120){log('Trama demasiado larga; se reinicia búfer');buffer=''}}
$('connect').onclick=async()=>{if(!navigator.bluetooth){status('Web Bluetooth no disponible. Abra esta página desde Chrome para Android mediante HTTPS.');return}try{status('Buscando bastón…');device=await navigator.bluetooth.requestDevice({filters:[{namePrefix:'WS-S02'}],optionalServices:[serviceUUID]});device.addEventListener('gattserverdisconnected',disconnected);status('Conectando…');const server=await device.gatt.connect();const service=await server.getPrimaryService(serviceUUID);characteristic=await service.getCharacteristic(notifyUUID);characteristic.addEventListener('characteristicvaluechanged',received);await characteristic.startNotifications();status('Conectado · esperando chip');$('connect').disabled=true;$('disconnect').disabled=false;log('Notificaciones FFE4 activadas en '+device.name)}catch(e){status('No se pudo conectar: '+e.message);log('Error: '+e.name+' '+e.message);$('connect').disabled=false}};
$('disconnect').onclick=()=>{if(device?.gatt?.connected)device.gatt.disconnect();else disconnected()};
</script></body></html>
