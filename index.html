<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#245b3b"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css"><title>GUJAR Ganado</title></head><body><header><div><b>GUJAR Ganado</b><small id="net">● verificando...</small></div></header><main><section id="home" class="view active"><h1>Control de ganado de ceba</h1><div class="cards"><button onclick="show('ingreso')">＋ Nuevo ingreso</button><button onclick="show('pesaje')">⚖ Nuevo pesaje</button><button onclick="show('animales')">🐂 Animales</button></div><div class="stats"><div><strong id="nActivos">0</strong><span>Activos</span></div><div><strong id="nPesajes">0</strong><span>Pesajes</span></div></div></section><section id="ingreso" class="view"><h2>Nuevo ingreso</h2><form id="fIngreso"><label>Número visual<input id="ivis" required placeholder="Ej. 094-56"></label><label>RFID / Chip<input id="irfid" inputmode="numeric" placeholder="Digitar o Bluetooth"></label><label>Peso de entrada (kg)<input id="ipeso" type="number" step=".1" required></label><label>Sexo<select id="isexo"><option>Macho</option><option>Hembra</option></select></label><label>Color / señas<input id="isenas"></label><label>Finca<input id="ifinca" placeholder="Finca"></label><label>Proveedor<input id="iprov"></label><label>Precio $/kg<input id="iprecio" type="number" step=".01"></label><label>Transporte total del ingreso<input id="itrans" type="number" step=".01"></label><button type="submit">Guardar animal</button></form></section><section id="pesaje" class="view"><h2>Nuevo pesaje</h2><form id="fPesaje"><label>Número visual o RFID<input id="pbuscar" required></label><label>Peso (kg)<input id="ppeso" type="number" step=".1" required></label><label>Fecha<input id="pfecha" type="date" required></label><button type="submit">Guardar pesaje</button></form><div id="resultado"></div></section><section id="animales" class="view"><h2>Animales</h2><input id="buscar" placeholder="Buscar número o RFID"><div id="lista"></div></section></main><nav><button onclick="show('home')">Inicio</button><button onclick="show('ingreso')">Ingreso</button><button onclick="show('pesaje')">Pesaje</button><button onclick="show('animales')">Animales</button></nav><script src="app.js"></script></body></html>
