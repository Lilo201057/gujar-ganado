<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#245b3b"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css?v=13"><title>GUJAR Ganado</title></head><body><header><div><b>GUJAR Ganado</b><small id="net"></small></div><div id="fincaBar" class="fincaBar" onclick="show('fincas')">📍 <span id="fincaTxt">Escoger finca</span></div></header><main><section id="fincas" class="view"><h1>¿En qué finca va a trabajar?</h1><p class="muted">Seleccione una de las dos fincas.</p><div id="fincaBtns" class="cards"></div></section><section id="home" class="view"><h1>Control de ganado de ceba</h1><div class="cards"><button onclick="nuevoIngreso()">＋ Nuevo ingreso</button><button onclick="show('pesaje')">⚖ Nuevo pesaje</button><button onclick="show('animales')">🐂 Animales</button></div><div class="stats"><div><strong id="nActivos">0</strong><span>Activos en esta finca</span></div><div><strong id="nPesajes">0</strong><span>Pesajes</span></div></div></section><section id="cabecera" class="view"><h2>Nuevo ingreso</h2><p class="muted">Primero registre los datos generales del lote.</p><form id="fCab"><label>Fecha de ingreso<input id="cfecha" type="date" required></label><label>Proveedor<input id="cprov" required></label><label>Valor total del flete ($)<input id="cflete" type="number" min="0" required></label><label>Precio de compra ($/kg)<input id="cprecio" type="number" min="0" step=".01"></label><label>Animales esperados<input id="cesperados" type="number" min="1"></label><button type="submit">Iniciar ingreso →</button></form></section><section id="ingreso" class="view"><div id="ingresoResumen" class="resumen"></div><h2>Registrar animal</h2><form id="fIngreso"><label>Número visual<input id="ivis" required></label><label>RFID / Chip<input id="irfid" inputmode="numeric"></label><label>Peso de entrada (kg)<input id="ipeso" type="number" step=".1" required></label><label>Sexo<select id="isexo"><option>Macho</option><option>Hembra</option></select></label><label>Color / señas<input id="isenas"></label><button type="submit">Guardar y siguiente</button><button type="button" class="secondary" onclick="cerrarIngreso()">Finalizar ingreso</button></form></section><section id="pesaje" class="view"><h2>Nuevo pesaje</h2><form id="fPesaje"><label>Número visual o RFID<input id="pbuscar" required></label><label>Peso (kg)<input id="ppeso" type="number" step=".1" required></label><label>Fecha<input id="pfecha" type="date" required></label><button type="submit">Guardar pesaje</button></form><div id="resultado"></div></section><section id="animales" class="view"><h2>Animales</h2><input id="buscar" placeholder="Buscar número o RFID"><div id="lista"></div></section></main><nav><button onclick="show('home')">Inicio</button><button onclick="nuevoIngreso()">Ingreso</button><button onclick="show('pesaje')">Pesaje</button><button onclick="show('animales')">Animales</button></nav><script src="app.js?v=13"></script></body></html>
