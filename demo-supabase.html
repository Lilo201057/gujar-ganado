<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GUJAR Demo Compartida</title><style>body{font-family:Arial,sans-serif;background:#f4f7f4;color:#17251d;margin:0}header{background:#245b3b;color:#fff;padding:18px}main{max-width:760px;margin:auto;padding:18px}.note{background:#fff3cd;padding:12px;border-radius:10px;margin-bottom:15px}.card,form{background:#fff;border:1px solid #dbe3dd;border-radius:12px;padding:14px;margin:9px 0}.card b{font-size:18px}.muted{color:#65736a;font-size:13px}button{background:#2f6f49;color:#fff;border:0;border-radius:10px;padding:12px 16px;font-weight:bold}input,select{width:100%;box-sizing:border-box;padding:11px;margin:5px 0 10px;border:1px solid #c9d3cc;border-radius:9px;font-size:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}</style></head><body><header><b>GUJAR Ganado · Demostración compartida</b></header><main><div class="note"><b>DATOS FICTICIOS DE PRUEBA.</b> Esta pantalla lee y agrega datos directamente en Supabase.</div><h2>Agregar animal de prueba</h2><form id="f"><label>Número visual<input id="v" value="D-301" required></label><label>Finca<select id="fi"><option>Montecristo</option><option>La Insula</option></select></label><label>Peso (kg)<input id="p" type="number" step=".1" value="242.5" required></label><button>Guardar en la nube</button><div id="msg" class="muted"></div></form><div class="top"><div><h2>Animales en la nube</h2><span id="estado" class="muted">Consultando...</span></div><button onclick="cargar()">Actualizar</button></div><div id="lista"></div></main><script>const BASE='https://jkpvlrqtvdehhygyddkx.supabase.co/rest/v1/demo_ganado',KEY='sb_publishable_3M-XzX4D8AzcivBZ7zIBOw_TpFDTLsf';const H={apikey:KEY,'Content-Type':'application/json'};async function cargar(){const e=document.getElementById('estado'),l=document.getElementById('lista');e.textContent='Consultando Supabase...';try{const r=await fetch(BASE+'?select=id,numero_visual,rfid,finca,sexo,color,peso_kg,observaciones,creado_en&order=id.asc',{headers:H});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();e.textContent=d.length+' animales · '+new Date().toLocaleTimeString('es-CO');l.innerHTML=d.map(a=>'<div class="card"><b>'+a.numero_visual+' · '+a.peso_kg+' kg</b><div>'+a.finca+' · '+a.sexo+' · '+a.color+'</div><div class="muted">RFID '+(a.rfid||'—')+' · '+(a.observaciones||'')+'</div></div>').join('')}catch(x){e.textContent='No fue posible consultar la base';l.innerHTML='<div class="card">'+x.message+'</div>'}}document.getElementById('f').onsubmit=async e=>{e.preventDefault();const m=document.getElementById('msg');m.textContent='Guardando...';const body={numero_visual:document.getElementById('v').value.trim(),finca:document.getElementById('fi').value,peso_kg:Number(document.getElementById('p').value),sexo:'Macho',color:'Negro',observaciones:'CREADO DESDE LA APLICACIÓN - PRUEBA COMPARTIDA'};try{const r=await fetch(BASE,{method:'POST',headers:{...H,Prefer:'return=minimal'},body:JSON.stringify(body)});if(!r.ok)throw new Error('HTTP '+r.status);m.textContent='Guardado correctamente en Supabase.';await cargar()}catch(x){m.textContent='Error: '+x.message}};cargar();</script></body></html>
