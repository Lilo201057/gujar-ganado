<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GUJAR Demo Compartida</title><style>body{font-family:Arial,sans-serif;background:#f4f7f4;color:#17251d;margin:0}header{background:#245b3b;color:white;padding:18px}main{max-width:760px;margin:auto;padding:18px}.note{background:#fff3cd;padding:12px;border-radius:10px;margin-bottom:15px}.card{background:white;border:1px solid #dbe3dd;border-radius:12px;padding:14px;margin:9px 0}.card b{font-size:18px}.muted{color:#65736a;font-size:13px}button{background:#2f6f49;color:white;border:0;border-radius:10px;padding:12px 16px;font-weight:bold}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}</style></head><body><header><b>GUJAR Ganado · Demostración compartida</b></header><main><div class="note"><b>DATOS FICTICIOS DE PRUEBA.</b> Esta pantalla lee la información directamente desde la base central de Supabase.</div><div class="top"><div><h2>Animales en la nube</h2><span id="estado" class="muted">Consultando...</span></div><button onclick="cargar()">Actualizar</button></div><div id="lista"></div></main><script>const URL='https://jkpvlrqtvdehhygyddkx.supabase.co/rest/v1/demo_ganado?select=id,numero_visual,rfid,finca,sexo,color,peso_kg,observaciones,creado_en&order=id.asc';const KEY='sb_publishable_3M-XzX4D8AzcivBZ7zIBOw_TpFDTLsf';async function cargar(){const e=document.getElementById('estado'),l=document.getElementById('lista');e.textContent='Consultando Supabase...';try{const r=await fetch(URL,{headers:{apikey:KEY}});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();e.textContent=d.length+' animales · '+new Date().toLocaleTimeString('es-CO');l.innerHTML=d.map(a=>'<div class="card"><b>'+a.numero_visual+' · '+a.peso_kg+' kg</b><div>'+a.finca+' · '+a.sexo+' · '+a.color+'</div><div class="muted">RFID '+a.rfid+' · '+a.observaciones+'</div></div>').join('')}catch(x){e.textContent='No fue posible consultar la base';l.innerHTML='<div class="card">'+x.message+'</div>'}}cargar();</script></body></html>
